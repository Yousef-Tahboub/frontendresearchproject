<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Phishing Analyst Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane analyst console — queue | analysis | assistant; stacks on narrow screens */
:root {
  --bg: #eef1f5; --panel: #ffffff; --sunk: #f5f7fa; --line: #d8dee7;
  --fg: #172033; --muted: #5b6678; --accent: #2448b8; --accent-soft: #e4eafb;
  --warn: #a86400; --warn-soft: #fbf0dc;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141d; --panel: #161d29; --sunk: #1b2331; --line: #2a3446;
  --fg: #e4e9f2; --muted: #93a0b5; --accent: #7d9cff; --accent-soft: #1f2a48;
  --warn: #f0b35a; --warn-soft: #362a14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141d; --panel: #161d29; --sunk: #1b2331; --line: #2a3446;
  --fg: #e4e9f2; --muted: #93a0b5; --accent: #7d9cff; --accent-soft: #1f2a48;
  --warn: #f0b35a; --warn-soft: #362a14; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; min-height: 100%; padding-block: 0 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; margin: 0; }
.proto { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 3px; }
.modelchip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.modelchip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.grid { display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; gap: 14px; flex: 1; min-height: 0; }
@media (max-width: 1100px) { .grid { grid-template-columns: 260px minmax(0, 1fr); } .chat { grid-column: 1 / -1; min-height: 420px; } }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pane-head h2 { font-family: var(--f-display); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }

/* Queue */
.queue { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.queue li button { all: unset; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
.queue li button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.queue li button:hover { background: var(--sunk); }
.queue li.active button { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.q-row { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.q-from { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.q-subj { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.submit { padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); display: flex; flex-direction: column; gap: 8px; }
.submit label { font-size: 12px; color: var(--muted); font-weight: 500; }
.submit textarea { width: 100%; min-height: 140px; resize: vertical; font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--panel); }
.submit .row { display: flex; gap: 8px; justify-content: flex-end; }

/* Analysis */
.analysis { overflow-y: auto; }
.email-head { padding: 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.email-head h3 { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.email-head .meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.slots { padding: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .slots { grid-template-columns: minmax(0, 1fr); } }
.slot { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--sunk); }
.slot.wide { grid-column: 1 / -1; min-height: 120px; }
.slot .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.slot .ph { color: var(--muted); font-style: italic; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 18px; }
details { padding: 0 18px 18px; }
details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
pre.raw { font-family: var(--f-mono); font-size: 12px; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0 0; }

/* Chat */
.chat .log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 240px; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--panel); border-bottom-right-radius: 2px; }
.msg.bot { align-self: flex-start; background: var(--sunk); border: 1.5px dashed var(--line); color: var(--muted); font-style: italic; border-bottom-left-radius: 2px; }
.msg.sys { align-self: center; font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 2px; text-align: center; }
.composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); }

.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 20; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Phishing Analyst Console</h1>
      <span class="proto">Prototype · placeholder AI</span>
    </div>
    <span class="modelchip"><span class="dot"></span>Fine-tuned Qwen</span>
  </header>

  <div class="grid">
    <section class="pane" aria-label="Email queue">
      <div class="pane-head">
        <h2>Inbox</h2>
        <button class="btn" id="toggleSubmit" aria-expanded="false">Submit email</button>
      </div>
      <form class="submit" id="submitForm" hidden>
        <label for="rawInput">Paste the raw email (headers and body)</label>
        <textarea id="rawInput" spellcheck="false" placeholder="From: ...&#10;Subject: ...&#10;&#10;Body text"></textarea>
        <div class="row">
          <button type="button" class="btn" id="cancelSubmit">Cancel</button>
          <button type="submit" class="btn primary">Analyze</button>
        </div>
      </form>
      <ul class="queue" id="queue"></ul>
    </section>

    <section class="pane analysis" id="analysis" aria-label="Analysis"></section>

    <section class="pane chat" aria-label="Analyst assistant">
      <div class="pane-head">
        <h2>Assistant</h2>
        <button class="btn" id="clearChat">Clear</button>
      </div>
      <div class="log" id="log"></div>
      <form class="composer" id="composer">
        <input id="chatInput" type="text" placeholder="Ask about this email…" autocomplete="off" aria-label="Message the assistant">
        <button class="btn primary" type="submit">Send</button>
      </form>
    </section>
  </div>
</div>

<script>
/* Example emails for the demo inbox */
const SAMPLES = [
`From: "Accounts Payable" <billing@micros0ft-invoices.com>
Subject: URGENT: Overdue invoice #INV-88213
Date: Thu, 5 Nov 2026 09:14:02 -0500

Your account is past due. Pay here: http://185.22.41.9/pay/invoice?id=88213`,
`From: "IT Service Desk" <helpdesk@company-support.net>
Subject: Password expires today - verify your account
Date: Thu, 5 Nov 2026 08:02:44 -0500

Verify your credentials: https://login.company-support.net/verify`,
`From: "Benefits Team" <benefits@company.com>
Subject: Open enrollment documents for 2027
Date: Wed, 4 Nov 2026 16:40:10 -0500

Open enrollment starts Monday. The benefits guide is attached.`,
`From: "GitHub" <noreply@github.com>
Subject: [company/infra] Pull request #412 merged
Date: Wed, 4 Nov 2026 14:12:55 -0500

Merged #412 into main.`
];

/* =====================================================================
   PLACEHOLDER AI — one fine-tuned Qwen model does both jobs.
   Replace these two functions with calls to your Qwen server.
   ===================================================================== */
const QWEN = { endpoint: '/v1/chat/completions', model: 'qwen-phish' }; // TODO

// TODO: send email.raw to Qwen, return { verdict, confidence, explanation }
async function detectThreat(email) {
  return { verdict: null, confidence: null, explanation: null };
}

// TODO: send the question + email + detection result to Qwen, return its reply
async function askAssistant(question, email) {
  await new Promise(r => setTimeout(r, 400));
  return 'Qwen response will appear here.';
}

/* ---------- helpers ---------- */
function parseEmail(raw) {
  const [head] = raw.replace(/\r/g, '').split(/\n\s*\n/);
  const h = {};
  head.split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) h[l.slice(0, i).trim().toLowerCase()] = l.slice(i + 1).trim(); });
  return { raw, from: h.from || '(unknown sender)', subject: h.subject || '(no subject)', date: h.date || new Date().toString() };
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const nameOf = v => { const m = (v || '').match(/^"?([^"<]+)"?\s*</); return m ? m[1].trim() : v; };
const timeOf = d => { const t = new Date(d); return isNaN(t) ? '' : t.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const $ = id => document.getElementById(id);
const ph = (v, text) => v == null ? `<span class="ph">${text}</span>` : esc(v);

/* ---------- state ---------- */
const state = { emails: [], selected: null, chats: {} };

async function addEmail(raw, select) {
  const e = parseEmail(raw);
  e.id = 'e' + Math.random().toString(36).slice(2, 8);
  e.result = await detectThreat(e);
  state.emails.unshift(e);
  if (select) state.selected = e.id;
  render();
}

function render() {
  $('queue').innerHTML = state.emails.map(e => `
    <li class="${e.id === state.selected ? 'active' : ''}"><button data-id="${e.id}">
      <span class="q-row"><span class="q-from">${esc(nameOf(e.from))}</span><span class="q-time">${esc(timeOf(e.date))}</span></span>
      <span class="q-subj">${esc(e.subject)}</span>
    </button></li>`).join('');

  const e = state.emails.find(x => x.id === state.selected);
  $('analysis').innerHTML = !e ? '<div class="email-head"><span class="meta">Select an email.</span></div>' : `
    <div class="email-head">
      <h3>${esc(e.subject)}</h3>
      <span class="meta">${esc(e.from)} · ${esc(timeOf(e.date))}</span>
    </div>
    <div class="slots">
      <div class="slot"><span class="label">Verdict</span>${ph(e.result.verdict, 'Model verdict')}</div>
      <div class="slot"><span class="label">Confidence</span>${ph(e.result.confidence, 'Confidence score')}</div>
      <div class="slot wide"><span class="label">Explanation</span>${ph(e.result.explanation, 'Qwen explanation of the result will appear here')}</div>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="Quarantined">Quarantine</button>
      <button class="btn" data-act="Marked safe">Mark safe</button>
      <button class="btn" data-act="Escalated">Escalate</button>
    </div>
    <details><summary>View raw email</summary><pre class="raw">${esc(e.raw)}</pre></details>`;

  const msgs = e ? (state.chats[e.id] ||= []) : [];
  $('log').innerHTML = `<div class="msg sys">${e ? 'About: ' + esc(e.subject) : 'No email selected'}</div>` +
    msgs.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join('');
  $('log').scrollTop = $('log').scrollHeight;
}

async function send(text) {
  text = text.trim(); if (!text) return;
  const e = state.emails.find(x => x.id === state.selected);
  if (!e) return toast('Select an email first');
  const msgs = state.chats[e.id];
  msgs.push({ role: 'user', text }); render();
  msgs.push({ role: 'bot', text: await askAssistant(text, e) }); render();
}

function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2000); }

/* ---------- events ---------- */
$('queue').addEventListener('click', ev => { const b = ev.target.closest('[data-id]'); if (b) { state.selected = b.dataset.id; render(); } });
$('analysis').addEventListener('click', ev => { const a = ev.target.closest('[data-act]'); if (a) toast(a.dataset.act); });
const closeForm = () => { $('submitForm').hidden = true; $('toggleSubmit').setAttribute('aria-expanded', 'false'); };
$('toggleSubmit').addEventListener('click', () => { const f = $('submitForm'); f.hidden = !f.hidden; $('toggleSubmit').setAttribute('aria-expanded', String(!f.hidden)); if (!f.hidden) $('rawInput').focus(); });
$('cancelSubmit').addEventListener('click', closeForm);
$('submitForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const raw = $('rawInput').value.trim();
  if (!raw) return toast('Paste an email to analyze');
  $('rawInput').value = ''; closeForm();
  await addEmail(raw, true);
});
$('composer').addEventListener('submit', ev => { ev.preventDefault(); const v = $('chatInput').value; $('chatInput').value = ''; send(v); });
$('clearChat').addEventListener('click', () => { if (state.selected) { state.chats[state.selected] = []; render(); } });

(async () => {
  for (const raw of [...SAMPLES].reverse()) await addEmail(raw);
  state.selected = state.emails[0].id; render();
})();
</script>

</body></html>
